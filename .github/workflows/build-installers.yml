name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.0). Leave empty to use gloria.toml.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run regression tests
        shell: powershell
        run: powershell.exe -NoProfile -STA -File .\tests\Run-Tests.ps1

      - name: Build GameLauncher.exe
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Build-Launcher.ps1

      - name: Stage runtime files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path app-dist -Force | Out-Null
          Copy-Item -LiteralPath .\GameLauncher.exe -Destination app-dist\GameLauncher.exe
          Get-ChildItem app-dist

      - name: Make sure the release exists
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "$TAG"

      - name: Pack and attach the setup
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          version: ${{ inputs.version }}
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
